    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3B36"/>
      <stop offset="1" stop-color="#06201E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.27" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2ED3A0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ED3A0" stop-opacity="0"/>
