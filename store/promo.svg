  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#halo)"/>
  <!-- The logo (icons/logo.svg) is drawn at x=34 y=70, 140x140, when rendering. -->
