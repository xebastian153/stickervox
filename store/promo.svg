  <rect x="196" y="190" width="192" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="292" y="207.5" text-anchor="middle" fill="#E6F4F0" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="12">Para WhatsApp Web · No oficial</text>
