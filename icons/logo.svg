<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- StickerVox logo: a die-cut sticker with a peeled corner holding a sound equalizer. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ED3A0"/>
      <stop offset="0.55" stop-color="#0E9479"/>
      <stop offset="1" stop-color="#075E57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16C08F"/>
      <stop offset="1" stop-color="#0A6F63"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FBF9"/>
      <stop offset="1" stop-color="#B9D8D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#03302C" flood-opacity="0.45"/>
    </filter>
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#03302C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <g transform="rotate(-8 256 256)">
    <!-- Sticker body with the bottom-right corner cut where it peels. -->
    <path filter="url(#shadow)" fill="#FFFFFF"
      d="M172 104 H340 A64 64 0 0 1 404 168 V298 L298 404 H172 A64 64 0 0 1 108 340 V168 A64 64 0 0 1 172 104 Z"/>
    <!-- Equalizer bars. -->
    <g fill="url(#bars)">
      <rect x="150" y="214" width="30" height="72" rx="15"/>
      <rect x="194" y="174" width="30" height="152" rx="15"/>
      <rect x="238" y="144" width="30" height="212" rx="15"/>
      <rect x="282" y="184" width="30" height="132" rx="15"/>
      <rect x="326" y="208" width="30" height="84" rx="15"/>
    </g>
    <!-- Peeled corner flap. -->
    <path filter="url(#flapShadow)" fill="url(#flap)"
      d="M404 298 L298 404 Q292 336 312 314 Q334 292 404 298 Z"/>
  </g>
</svg>
